<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500"><rect x="0" y="0" width="2400" height="1500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/><text x="65" y="75" font-family="Arial, sans-serif" font-size="43" fill="#172a3a" font-weight="700" text-anchor="start">pH subsystem | supply wiring and local decoupling</text><text x="65" y="118" font-family="Arial, sans-serif" font-size="25" fill="#526575" font-weight="400" text-anchor="start">Sheet 2  /  same named nets as sheet 1  /  keep sensor supply and high-current pump paths separate</text><line x1="65" y1="150" x2="2335" y2="150" stroke="#dbe3e9" stroke-width="2"/><text x="90" y="210" font-family="Arial, sans-serif" font-size="28" fill="#176492" font-weight="700" text-anchor="start">CLEAN SENSOR SUPPLY</text><text x="90" y="270" font-family="Arial, sans-serif" font-size="27" fill="#172a3a" font-weight="400" text-anchor="start">Regulated +5.00 V -&gt; SEN0161 + terminal</text><text x="90" y="320" font-family="Arial, sans-serif" font-size="26" fill="#172a3a" font-weight="400" text-anchor="start">Supply negative -&gt; common GND</text><text x="90" y="370" font-family="Arial, sans-serif" font-size="25" fill="#526575" font-weight="400" text-anchor="start">C2 100 nF and C3 10 uF are shown on sheet 1.</text><text x="1300" y="210" font-family="Arial, sans-serif" font-size="28" fill="#b64136" font-weight="700" text-anchor="start">PUMP SUPPLY</text><text x="1300" y="270" font-family="Arial, sans-serif" font-size="27" fill="#172a3a" font-weight="400" text-anchor="start">Regulated +6 V, &gt;=3 A capability (example)</text><text x="1300" y="320" font-family="Arial, sans-serif" font-size="25" fill="#172a3a" font-weight="400" text-anchor="start">Feeds both pump + terminals and U3/U4 VDD.</text><text x="1300" y="370" font-family="Arial, sans-serif" font-size="25" fill="#526575" font-weight="400" text-anchor="start">Separate heater demand is not included in this rating.</text><text x="220" y="480" font-family="Arial, sans-serif" font-size="26" fill="#176492" font-weight="700" text-anchor="start">U3 DRIVER BYPASS</text><line x1="320" y1="550" x2="650" y2="550" stroke="#b64136" stroke-width="3"/><text x="320" y="520" font-family="Arial, sans-serif" font-size="24" fill="#b64136" font-weight="700" text-anchor="start">+6 V</text><line x1="320" y1="550" x2="320" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="297" y1="643.0" x2="343" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="297" y1="657.0" x2="343" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="320" y1="657.0" x2="320" y2="750" stroke="#172a3a" stroke-width="3"/><text x="285" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="end">C4</text><text x="285" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="end">100 nF</text><line x1="650" y1="550" x2="650" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="627" y1="643.0" x2="673" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="627" y1="657.0" x2="673" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="650" y1="657.0" x2="650" y2="750" stroke="#172a3a" stroke-width="3"/><text x="685" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="start">C5</text><text x="685" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="start">1 uF, &gt;=16 V</text><line x1="320" y1="750" x2="320" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="298" y1="764" x2="342" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="306" y1="772" x2="334" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="314" y1="780" x2="326" y2="780" stroke="#172a3a" stroke-width="3"/><line x1="650" y1="750" x2="650" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="628" y1="764" x2="672" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="636" y1="772" x2="664" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="644" y1="780" x2="656" y2="780" stroke="#172a3a" stroke-width="3"/><text x="220" y="850" font-family="Arial, sans-serif" font-size="24" fill="#172a3a" font-weight="400" text-anchor="start">At U3 pins 1,8 (+6 V) and 4,5 (GND).</text><text x="1050" y="480" font-family="Arial, sans-serif" font-size="26" fill="#176492" font-weight="700" text-anchor="start">U4 DRIVER BYPASS</text><line x1="1150" y1="550" x2="1480" y2="550" stroke="#b64136" stroke-width="3"/><text x="1150" y="520" font-family="Arial, sans-serif" font-size="24" fill="#b64136" font-weight="700" text-anchor="start">+6 V</text><line x1="1150" y1="550" x2="1150" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1127" y1="643.0" x2="1173" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1127" y1="657.0" x2="1173" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="1150" y1="657.0" x2="1150" y2="750" stroke="#172a3a" stroke-width="3"/><text x="1115" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="end">C6</text><text x="1115" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="end">100 nF</text><line x1="1480" y1="550" x2="1480" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1457" y1="643.0" x2="1503" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1457" y1="657.0" x2="1503" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="1480" y1="657.0" x2="1480" y2="750" stroke="#172a3a" stroke-width="3"/><text x="1515" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="start">C7</text><text x="1515" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="start">1 uF, &gt;=16 V</text><line x1="1150" y1="750" x2="1150" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1128" y1="764" x2="1172" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1136" y1="772" x2="1164" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="1144" y1="780" x2="1156" y2="780" stroke="#172a3a" stroke-width="3"/><line x1="1480" y1="750" x2="1480" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1458" y1="764" x2="1502" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1466" y1="772" x2="1494" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="1474" y1="780" x2="1486" y2="780" stroke="#172a3a" stroke-width="3"/><text x="1050" y="850" font-family="Arial, sans-serif" font-size="24" fill="#172a3a" font-weight="400" text-anchor="start">At U4 pins 1,8 (+6 V) and 4,5 (GND).</text><text x="1900" y="480" font-family="Arial, sans-serif" font-size="26" fill="#b64136" font-weight="700" text-anchor="start">BULK BYPASS</text><line x1="1930" y1="550" x2="2220" y2="550" stroke="#b64136" stroke-width="3"/><text x="1930" y="520" font-family="Arial, sans-serif" font-size="24" fill="#b64136" font-weight="700" text-anchor="start">+6 V</text><line x1="1930" y1="550" x2="1930" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1907" y1="643.0" x2="1953" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="1907" y1="657.0" x2="1953" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="1930" y1="657.0" x2="1930" y2="750" stroke="#172a3a" stroke-width="3"/><text x="1895" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="end">C8</text><text x="1895" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="end">470 uF, 16 V</text><text x="1890" y="636.0" font-family="Arial, sans-serif" font-size="23" fill="#172a3a" font-weight="400" text-anchor="start">+</text><line x1="2220" y1="550" x2="2220" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="2197" y1="643.0" x2="2243" y2="643.0" stroke="#172a3a" stroke-width="3"/><line x1="2197" y1="657.0" x2="2243" y2="657.0" stroke="#172a3a" stroke-width="3"/><line x1="2220" y1="657.0" x2="2220" y2="750" stroke="#172a3a" stroke-width="3"/><text x="2255" y="647.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="700" text-anchor="start">C9</text><text x="2255" y="675.0" font-family="Arial, sans-serif" font-size="22" fill="#172a3a" font-weight="400" text-anchor="start">100 nF</text><line x1="1930" y1="750" x2="1930" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1908" y1="764" x2="1952" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="1916" y1="772" x2="1944" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="1924" y1="780" x2="1936" y2="780" stroke="#172a3a" stroke-width="3"/><line x1="2220" y1="750" x2="2220" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="2198" y1="764" x2="2242" y2="764" stroke="#172a3a" stroke-width="3"/><line x1="2206" y1="772" x2="2234" y2="772" stroke="#172a3a" stroke-width="3"/><line x1="2214" y1="780" x2="2226" y2="780" stroke="#172a3a" stroke-width="3"/><text x="1860" y="850" font-family="Arial, sans-serif" font-size="24" fill="#172a3a" font-weight="400" text-anchor="start">Near pump supply entry.</text><rect x="90" y="980" width="2220" height="240" rx="12" fill="#f4f8fb" stroke="#dbe3e9" stroke-width="2.5"/><text x="115" y="1020" font-family="Arial, sans-serif" font-size="25" fill="#176492" font-weight="700" text-anchor="start">Grounding and power notes</text><text x="115" y="1062" font-family="Arial, sans-serif" font-size="23" fill="#172a3a" font-weight="400" text-anchor="start">Return Q1/Q2 source current directly to the pump supply negative. Route the pH conditioner return separately to the common point.</text><text x="115" y="1097" font-family="Arial, sans-serif" font-size="23" fill="#172a3a" font-weight="400" text-anchor="start">The Nano is USB powered. Connect its GND to the common point. Never connect the 6 V pump rail to Nano VBUS or GPIO.</text><text x="115" y="1132" font-family="Arial, sans-serif" font-size="23" fill="#172a3a" font-weight="400" text-anchor="start">Do not connect external +5 V to VBUS while USB power is present. Separate named rails are joined only at GND.</text><text x="115" y="1167" font-family="Arial, sans-serif" font-size="23" fill="#172a3a" font-weight="400" text-anchor="start">Use lab-approved branch protection sized from measured startup/stall current, conductor ratings and supply fault current.</text><text x="90" y="1320" font-family="Arial, sans-serif" font-size="24" fill="#526575" font-weight="400" text-anchor="start">C8 positive terminal -&gt; +6 V; negative -&gt; GND. C3 positive -&gt; +5 V; negative -&gt; GND. C4-C7/C9 may be ceramic.</text><text x="90" y="1370" font-family="Arial, sans-serif" font-size="24" fill="#526575" font-weight="400" text-anchor="start">Illustrative design: no physical measurements, calibration or pump-flow test has been performed.</text></svg>