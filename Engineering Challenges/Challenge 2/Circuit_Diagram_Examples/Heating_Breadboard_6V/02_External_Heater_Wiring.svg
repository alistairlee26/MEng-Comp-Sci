" r="6" fill="#c44138" stroke="#c44138" stroke-width="2"/><polyline points="690,575 765,530" fill="none" stroke="#c44138" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="740" y="497" font-family="Arial,sans-serif" font-size="24" fill="#1c2d3b" font-weight="700" text-anchor="middle">SW1 · enable</text><text x="740" y="625" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="middle">DC-rated ≥5 A</text><polyline points="790,575 895,575" fill="none" stroke="#c44138" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><rect x="895" y="510" width="325" height="130" rx="12" fill="#fff6ee" stroke="#b66b38" stroke-width="2.5"/><text x="1057" y="556" font-family="Arial,sans-serif" font-size="28" fill="#1c2d3b" font-weight="700" text-anchor="middle">HEATER H1</text><text x="1057" y="600" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="400" text-anchor="middle">3 Ω · 30 W rated</text><polyline points="1220,575 1345,575 1345,1090 1625,1090 1625,930" fill="none" stroke="#c44138" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text x="1070" y="685" font-family="Arial,sans-serif" font-size="27" fill="#c44138" font-weight="700" text-anchor="middle">6 V → about 2 A and 12 W</text><text x="1070" y="728" font-family="Arial,sans-serif" font-size="23" fill="#526676" font-weight="400" text-anchor="middle">Keep the heating element immersed.</text><polyline points="410,480 410,1195 1900,1195 1900,930 1730,930" fill="none" stroke="white" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><polyline points="410,480 410,1195 1900,1195 1900,930 1730,930" fill="none" stroke="#263b47" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="410" cy="1195" r="11" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="420" y="1245" font-family="Arial,sans-serif" font-size="25" fill="#263b47" font-weight="700" text-anchor="start">STAR: supply negative terminal</text><text x="1500" y="1245" font-family="Arial,sans-serif" font-size="24" fill="#263b47" font-weight="400" text-anchor="middle">Thick direct return from SOURCE (leg 3)</text><circle cx="135" cy="530" r="7" fill="#c44138" stroke="#c44138" stroke-width="2"/><polyline points="135,530 65,530 65,900 140,900" fill="none" stroke="#c44138" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="140" y="876" width="190" height="48" rx="8" fill="#fff4f0" stroke="#c44138" stroke-width="2.5"/><text x="235" y="907" font-family="Arial,sans-serif" font-size="23" fill="#c44138" font-weight="700" text-anchor="middle">F2 · 250 mA</text><polyline points="330,900 540,900" fill="none" stroke="white" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><polyline points="330,900 540,900" fill="none" stroke="#c44138" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="540" y="840" width="520" height="180" rx="10" fill="#f2f8fa" stroke="#b8cbd5" stroke-width="2.5"/><text x="565" y="880" font-family="Arial,sans-serif" font-size="24" fill="#1c2d3b" font-weight="700" text-anchor="start">BREADBOARD CONNECTIONS</text><text x="565" y="920" font-family="Arial,sans-serif" font-size="23" fill="#c44138" font-weight="700" text-anchor="start">P1: A12 ← fused +6 V (F2 output)</text><text x="565" y="960" font-family="Arial,sans-serif" font-size="23" fill="#263b47" font-weight="700" text-anchor="start">P2: H29 ← STAR / supply negative</text><text x="565" y="997" font-family="Arial,sans-serif" font-size="23" fill="#188466" font-weight="700" text-anchor="start">P3: B23 → Q1 GATE (leg 1)</text><polyline points="410,1195 470,1195 470,955 540,955" fill="none" stroke="white" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><polyline points="410,1195 470,1195 470,955 540,955" fill="none" stroke="#263b47" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,990 1180,990 1180,930 1520,930" fill="none" stroke="white" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,990 1180,990 1180,930 1520,930" fill="none" stroke="#188466" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1520,930 1520,1105 1450,1105" fill="none" stroke="white" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1520,930 1520,1105 1450,1105" fill="none" stroke="#188466" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="1300" y="1084" width="150" height="42" rx="5" fill="#e9d3ad" stroke="#a58c65" stroke-width="2.5"/><text x="1375" y="1112" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="middle">R4 · 100k</text><polyline points="1300,1105 1265,1105 1265,1160 1900,1160" fill="none" stroke="white" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1300,1105 1265,1105 1265,1160 1900,1160" fill="none" stroke="#263b47" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1900,1160 1900,1195" fill="none" stroke="#263b47" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1900" cy="1160" r="6" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="2050" y="1090" font-family="Arial,sans-serif" font-size="24" fill="#1c2d3b" font-weight="700" text-anchor="middle">R4 connects G to S</text><text x="2050" y="1125" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="middle">at the MOSFET connector.</text><circle cx="1520" cy="962" r="17" fill="#188466" stroke="#188466" stroke-width="2"/><text x="1520" y="968" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="middle">1</text><text x="1545" y="1015" font-family="Arial,sans-serif" font-size="28" fill="#188466" font-weight="700" text-anchor="start">G</text><circle cx="1625" cy="962" r="17" fill="#c44138" stroke="#c44138" stroke-width="2"/><text x="1625" y="968" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="middle">2</text><text x="1650" y="1015" font-family="Arial,sans-serif" font-size="28" fill="#c44138" font-weight="700" text-anchor="start">D</text><circle cx="1730" cy="962" r="17" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="1730" y="968" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="middle">3</text><text x="1755" y="1015" font-family="Arial,sans-serif" font-size="28" fill="#263b47" font-weight="700" text-anchor="start">S</text><polyline points="70,1300 2230,1300" fill="none" stroke="#d7e1e7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="1345" font-family="Arial,sans-serif" font-size="24" fill="#526676" font-weight="400" text-anchor="start">Use insulated, secured screw terminals or a soldered adapter for Q1. The drawing shows electrical connections, not bare wire twists.</text><text x="70" y="1383" font-family="Arial,sans-serif" font-size="24" fill="#526676" font-weight="400" text-anchor="start">Heater leads, switch and terminals: rated ≥5 A DC. Fit F1 close to the supply. Driver leads use the separate F2 branch.</text><text x="70" y="1421" font-family="Arial,sans-serif" font-size="24" fill="#c44138" font-weight="700" text-anchor="start">Do not select 12 V for this build, and do not connect +6 V to Nano 3V3, VBUS or any GPIO. Nano remains USB powered.</text></svg>