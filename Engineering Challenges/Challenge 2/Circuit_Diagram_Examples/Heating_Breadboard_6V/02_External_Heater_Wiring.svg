<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1500" viewBox="0 0 2300 1500"><rect x="0" y="0" width="2300" height="1500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="43" fill="#1c2d3b" font-weight="700" text-anchor="start">Heating subsystem · external power wiring</text><text x="70" y="124" font-family="Arial,sans-serif" font-size="25" fill="#526676" font-weight="400" text-anchor="start">Use regulated 6 V, rated ≥3 A  |  approximately 2 A / 12 W at full heater duty  |  heater current bypasses breadboard</text><polyline points="70,155 2230,155" fill="none" stroke="#d7e1e7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="2230" y="1460" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="end">2 / 3</text><text x="70" y="205" font-family="Arial,sans-serif" font-size="27" fill="#1c2d3b" font-weight="700" text-anchor="start">IRLB8748 front view: printed part number facing you, metal tab behind, legs downward.</text><rect x="1500" y="340" width="250" height="130" rx="12" fill="#bec6cd" stroke="#6d7b85" stroke-width="2.5"/><circle cx="1625" cy="392" r="28" fill="white" stroke="#6d7b85" stroke-width="2"/><rect x="1475" y="450" width="300" height="300" rx="15" fill="#25323a" stroke="#15232c" stroke-width="2.5"/><text x="1625" y="525" font-family="Arial,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">IRLB8748</text><text x="1625" y="571" font-family="Arial,sans-serif" font-size="24" fill="#d6e0e5" font-weight="400" text-anchor="middle">Q1 · front face</text><text x="1625" y="612" font-family="Arial,sans-serif" font-size="22" fill="#d6e0e5" font-weight="700" text-anchor="middle">TAB = DRAIN</text><polyline points="1520,750 1520,930" fill="none" stroke="#8b969e" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><text x="1520" y="720" font-family="Arial,sans-serif" font-size="27"