<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1500" viewBox="0 0 2300 1500"><rect x="0" y="0" width="2300" height="1500" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="43" fill="#1c2d3b" font-weight="700" text-anchor="start">Heating subsystem · connection checklist</text><text x="70" y="124" font-family="Arial,sans-serif" font-size="25" fill="#526676" font-weight="400" text-anchor="start">Coordinates match page 1 exactly  |  A–E share one numbered strip; F–J share another  |  no connection across the centre gap</text><polyline points="70,155 2230,155" fill="none" stroke="#d7e1e7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="2230" y="1460" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="end">3 / 3</text><rect x="70" y="200" width="1050" height="44" rx="5" fill="#eaf1f5" stroke="#d4dfe5" stroke-width="2.5"/><text x="86" y="230" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">COMPONENT LEADS</text><rect x="70" y="244" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="271" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">R1</text><text x="315" y="271" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">E3 ↔ E9  |  10 kΩ, 1%</text><text x="86" y="310" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">R2</text><text x="315" y="310" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">H16 ↔ H22  |  100 kΩ</text><rect x="70" y="322" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="349" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">R3</text><text x="315" y="349" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">C17 ↔ C23  |  100 Ω</text><text x="86" y="388" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">C1</text><text x="315" y="388" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">A15 ↔ A18  |  1 µF ceramic, ≥16 V</text><rect x="70" y="400" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="427" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Thermistor</text><text x="315" y="427" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">D9 ↔ D6  |  10 kΩ NTC</text><rect x="1180" y="200" width="1050" height="44" rx="5" fill="#eaf1f5" stroke="#d4dfe5" stroke-width="2.5"/><text x="1196" y="230" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">IC PINS · TC4420 PDIP-8</text><rect x="1180" y="244" width="1050" height="35" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="271" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 1</text><text x="1425" y="271" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">F15  |  +6 V</text><text x="1196" y="306" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 2</text><text x="1425" y="306" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">F16  |  INPUT</text><rect x="1180" y="314" width="1050" height="35" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="341" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 3</text><text x="1425" y="341" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">F17  |  NC — leave empty</text><text x="1196" y="376" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 4</text><text x="1425" y="376" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">F18  |  GND</text><rect x="1180" y="384" width="1050" height="35" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="411" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 5</text><text x="1425" y="411" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">E18  |  GND</text><text x="1196" y="446" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 6</text><text x="1425" y="446" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">E17  |  OUTPUT</text><rect x="1180" y="454" width="1050" height="35" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="481" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 7</text><text x="1425" y="481" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">E16  |  OUTPUT</text><text x="1196" y="516" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Pin 8</text><text x="1425" y="516" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">E15  |  +6 V</text><rect x="70" y="490" width="1050" height="44" rx="5" fill="#eaf1f5" stroke="#d4dfe5" stroke-width="2.5"/><text x="86" y="520" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">INSULATED JUMPER WIRES</text><rect x="70" y="534" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="561" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J1</text><text x="315" y="561" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">B6 ↔ B18</text><text x="86" y="600" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J2</text><text x="315" y="600" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">C6 ↔ G22</text><rect x="70" y="612" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="639" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J3</text><text x="315" y="639" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">C12 ↔ C15</text><text x="86" y="678" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J4</text><text x="315" y="678" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">D15 ↔ G15</text><rect x="70" y="690" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="717" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J5</text><text x="315" y="717" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">D18 ↔ G18</text><text x="86" y="756" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J6</text><text x="315" y="756" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">D16 ↔ D17</text><rect x="70" y="768" width="1050" height="39" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="795" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">J7</text><text x="315" y="795" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">J18 ↔ J29</text><rect x="1180" y="580" width="1050" height="44" rx="5" fill="#eaf1f5" stroke="#d4dfe5" stroke-width="2.5"/><text x="1196" y="610" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">EXTERNAL LEADS</text><rect x="1180" y="624" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="651" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">N1</text><text x="1425" y="651" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Nano 3V3 → B3</text><text x="1196" y="688" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">N2</text><text x="1425" y="688" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Nano A0 → B9</text><rect x="1180" y="698" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="725" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">N3</text><text x="1425" y="725" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Nano GND → A6</text><text x="1196" y="762" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">N4</text><text x="1425" y="762" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Nano D5 → I16</text><rect x="1180" y="772" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="799" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">P1</text><text x="1425" y="799" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Fused +6 V driver branch (page 2) → A12</text><text x="1196" y="836" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">P2</text><text x="1425" y="836" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Supply-negative star point (page 2) → H29</text><rect x="1180" y="846" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="1196" y="873" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">P3</text><text x="1425" y="873" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">MOSFET gate (page 2) → B23</text><rect x="70" y="850" width="1050" height="44" rx="5" fill="#eaf1f5" stroke="#d4dfe5" stroke-width="2.5"/><text x="86" y="880" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">MOSFET / POWER CONNECTIONS</text><rect x="70" y="894" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="921" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Gate · leg 1</text><text x="315" y="921" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">B23; R4 100 kΩ to source</text><text x="86" y="958" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Drain · leg 2</text><text x="315" y="958" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Heater return; tab is also drain</text><rect x="70" y="968" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="995" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Source · leg 3</text><text x="315" y="995" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Direct heavy lead to supply negative</text><text x="86" y="1032" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">Heater +</text><text x="315" y="1032" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Supply +6 V via F1 and SW1</text><rect x="70" y="1042" width="1050" height="37" rx="0" fill="#f7f9fa" stroke="#f7f9fa" stroke-width="2.5"/><text x="86" y="1069" font-family="Arial,sans-serif" font-size="22" fill="#1c2d3b" font-weight="700" text-anchor="start">R4 · 100 kΩ</text><text x="315" y="1069" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">Across G and S at Q1 connector</text><text x="1180" y="960" font-family="Arial,sans-serif" font-size="26" fill="#1c2d3b" font-weight="700" text-anchor="start">FIRST POWER-UP</text><text x="1180" y="1002" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">1. Switch off and disconnect both power sources before wiring.</text><text x="1180" y="1039" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">2. Keep SW1 open; verify U2 notch and every hole in the tables.</text><text x="1180" y="1076" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">3. USB only: verify 3.3 V on B3 and about 1.65 V on B9 at 25°C.</text><text x="1180" y="1113" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">4. Set D5 LOW. Apply 6 V; G–S should be near 0 V.</text><text x="1180" y="1150" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">5. Heater disconnected: D5 HIGH should give about 6 V G–S.</text><text x="1180" y="1187" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">6. Return D5 LOW; power off, connect and immerse the heater.</text><text x="1180" y="1224" font-family="Arial,sans-serif" font-size="22" fill="#526676" font-weight="400" text-anchor="start">7. Reapply power, close SW1; check a short supervised test.</text><text x="70" y="1183" font-family="Arial,sans-serif" font-size="25" fill="#1c2d3b" font-weight="700" text-anchor="start">Design choices</text><text x="70" y="1222" font-family="Arial,sans-serif" font-size="23" fill="#526676" font-weight="400" text-anchor="start">R1 is 10 kΩ here; the whiteboard value was unclear.</text><text x="70" y="1260" font-family="Arial,sans-serif" font-size="23" fill="#526676" font-weight="400" text-anchor="start">D5 is used instead of D1, keeping TX available for UART.</text><text x="70" y="1298" font-family="Arial,sans-serif" font-size="23" fill="#526676" font-weight="400" text-anchor="start">TC4420 is an added part; do not omit it in this layout.</text><polyline points="70,1335 2230,1335" fill="none" stroke="#d7e1e7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="1377" font-family="Arial,sans-serif" font-size="24" fill="#1c2d3b" font-weight="400" text-anchor="start">Use D5 / A0 board labels in code, not raw ESP32 GPIO numbers. At 6 V, PWM varies heater power from 0 to approximately 12 W.</text><text x="70" y="1415" font-family="Arial,sans-serif" font-size="23" fill="#526676" font-weight="400" text-anchor="start">This is a checked drawing and connection plan; physical assembly and thermal performance have not been tested.</text></svg>