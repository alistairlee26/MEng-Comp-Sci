<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250"><rect x="0" y="0" width="2000" height="1250" rx="0" fill="white" stroke="white" stroke-width="2.5"/><text x="55" y="67" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#203442" text-anchor="start">Heating wiring · direct GPIO to MOSFET</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#546976" text-anchor="start">Set the heater supply to 6 V  |  about 2 A and 12 W when ON  |  use slow switching, around a one-second control period</text><polyline points="55,138 1945,138" fill="none" stroke="#d4dfe5" stroke-width="2" stroke-linejoin="round"/><text x="1940" y="1218" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#546976" text-anchor="end">2 / 2</text><text x="55" y="180" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#203442" text-anchor="start">IRLB8748: printed face toward you, metal tab behind, legs down → left G, middle D, right S.</text><rect x="90" y="280" width="300" height="150" rx="12" fill="#f2f7fa" stroke="#9eb2c0" stroke-width="2.5"/><text x="240" y="323" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#203442" text-anchor="middle">REGULATED SUPPLY</text><text x="240" y="366" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#be4035" text-anchor="middle">6.0 V · ≥3 A</text><text x="130" y="414" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#be4035" text-anchor="start">+</text><text x="350" y="414" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#203442" text-anchor="start">−</text><polyline points="130,430 130,520 350,520" fill="none" stroke="#be4035" stroke-width="9" stroke-linejoin="round"/><rect x="350" y="499" width="150" height="42" rx="6" fill="#fff4f1" stroke="#be4035" stroke-width="2.5"/><text x="425" y="527" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#be4035" text-anchor="middle">F1 · 3 A</text><polyline points="500,520 575,520" fill="none" stroke="#be4035" stroke-width="9" stroke-linejoin="round"/><circle cx="575" cy="520" r="5" fill="#be4035" stroke="#be4035" stroke-width="2"/><circle cx="660" cy="520" r="5" fill="#be4035" stroke="#be4035" stroke-width="2"/><polyline points="575,520 640,480" fill="none" stroke="#be4035" stroke-width="7" stroke-linejoin="round"/><text x="620" y="448" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#203442" text-anchor="middle">SW1</text><text x="620" y="572" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#546976" text-anchor="middle">DC-rated ≥5 A</text><polyline points="660,520 780,520" fill="none" stroke="#be4035" stroke-width="9" stroke-linejoin="round"/><rect x="780" y="460" width="310" height="120" rx="12" fill="#fff6ee" stroke="#b57540" stroke-width="2.5"/><text x="935" y="505" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#203442" text-anchor="middle">HEATER</text><text x="935" y="546" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#203442" text-anchor="middle">3 Ω · 30 W rated</text><text x="935" y="625" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#546976" text-anchor="middle">Keep the element immersed.</text><polyline points="1090,520 1200,520 1200,930 1540,930 1540,800" fill="none" stroke="#be4035" stroke-width="9" stroke-linejoin="round"/><rect x="1405" y="230" width="270" height="110" rx="10" fill="#b9c3ca" stroke="#748590" stroke-width="2.5"/><circle cx="1540" cy="275" r="22" fill="white" stroke="#748590" stroke-width="2"/><rect x="1385" y="320" width="310" height="270" rx="12" fill="#27353e" stroke="#1b2a34" stroke-width="2.5"/><text x="1540" y="384" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="white" text-anchor="middle">IRLB8748</text><text x="1540" y="432" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#d8e1e6" text-anchor="middle">Front view</text><text x="1540" y="472" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d8e1e6" text-anchor="middle">TAB = DRAIN</text><text x="1460" y="557" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">G</text><polyline points="1460,590 1460,800" fill="none" stroke="#8a969f" stroke-width="12" stroke-linejoin="round"/><text x="1540" y="557" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">D</text><polyline points="1540,590 1540,800" fill="none" stroke="#8a969f" stroke-width="12" stroke-linejoin="round"/><text x="1620" y="557" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white" text-anchor="middle">S</text><polyline points="1620,590 1620,800" fill="none" stroke="#8a969f" stroke-width="12" stroke-linejoin="round"/><polyline points="350,430 350,1040 1840,1040 1840,800 1620,800" fill="none" stroke="white" stroke-width="15" stroke-linejoin="round"/><polyline points="350,430 350,1040 1840,1040 1840,800 1620,800" fill="none" stroke="#203442" stroke-width="9" stroke-linejoin="round"/><circle cx="350" cy="1040" r="9" fill="#203442" stroke="#203442" stroke-width="2"/><text x="350" y="1080" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203442" text-anchor="start">STAR = supply negative terminal</text><rect x="490" y="720" width="480" height="185" rx="10" fill="#f2f8fa" stroke="#b2c7d4" stroke-width="2.5"/><text x="515" y="761" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203442" text-anchor="start">BREADBOARD CONNECTIONS</text><text x="515" y="811" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168169" text-anchor="start">B22 → GATE (left leg 1)</text><text x="515" y="859" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#203442" text-anchor="start">H26 → supply-negative STAR</text><polyline points="970,810 1130,810 1130,800 1460,800" fill="none" stroke="white" stroke-width="11" stroke-linejoin="round"/><polyline points="970,810 1130,810 1130,800 1460,800" fill="none" stroke="#168169" stroke-width="5" stroke-linejoin="round"/><polyline points="350,1040 430,1040 430,850 490,850" fill="none" stroke="white" stroke-width="11" stroke-linejoin="round"/><polyline points="350,1040 430,1040 430,850 490,850" fill="none" stroke="#203442" stroke-width="5" stroke-linejoin="round"/><polyline points="1460,800 1460,1000 1390,1000" fill="none" stroke="white" stroke-width="10" stroke-linejoin="round"/><polyline points="1460,800 1460,1000 1390,1000" fill="none" stroke="#168169" stroke-width="4" stroke-linejoin="round"/><rect x="1240" y="980" width="150" height="40" rx="5" fill="#e5d0a9" stroke="#a48c62" stroke-width="2.5"/><text x="1315" y="1008" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203442" text-anchor="middle">R3 · 100k</text><polyline points="1240,1000 1160,1000 1160,1020 1840,1020" fill="none" stroke="white" stroke-width="10" stroke-linejoin="round"/><polyline points="1240,1000 1160,1000 1160,1020 1840,1020" fill="none" stroke="#203442" stroke-width="4" stroke-linejoin="round"/><circle cx="1840" cy="1020" r="6" fill="#203442" stroke="#203442" stroke-width="2"/><text x="1640" y="895" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203442" text-anchor="start">SOURCE return</text><text x="1640" y="928" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#546976" text-anchor="start">direct to supply −</text><circle cx="1460" cy="780" r="17" fill="#168169" stroke="#168169" stroke-width="2"/><text x="1460" y="786" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text><circle cx="1540" cy="780" r="17" fill="#be4035" stroke="#be4035" stroke-width="2"/><text x="1540" y="786" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text><circle cx="1620" cy="780" r="17" fill="#203442" stroke="#203442" stroke-width="2"/><text x="1620" y="786" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text><polyline points="55,1110 1945,1110" fill="none" stroke="#d4dfe5" stroke-width="2" stroke-linejoin="round"/><text x="55" y="1148" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203442" text-anchor="start">Required check at 6 V: with Q1 fully ON, measure D–S voltage (red probe leg 2, black leg 3). Aim for &lt;0.1 V at about 2 A.</text><text x="55" y="1181" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#546976" text-anchor="start">Start with a brief supervised test. Stop if the voltage drop is high or increases. See the instructions for the complete check.</text><text x="55" y="1215" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#546976" text-anchor="start">Heater current stays off the breadboard. Secure power leads and MOSFET legs using an insulated terminal adapter.</text></svg>